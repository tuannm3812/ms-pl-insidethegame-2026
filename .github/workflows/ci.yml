name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t halftime-briefing .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name hb halftime-briefing
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs "localhost:8000/api/briefing?mode=fan&player=Silva" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['fan']['spotlight']['player']=='Silva'; print('ok')"
